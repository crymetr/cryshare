name: Build CrySnap

on:
  push:
    branches:
      - "**"
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
    paths-ignore:
      - "**/*.md"
      - "**/*.gitignore"
      - "**/*.gitattributes"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (Release x64)
    runs-on: windows-latest

    env:
      SOLUTION_FILE_PATH: ShareX.sln
      ASSEMBLY_INFO_PATH: Directory.build.props
      RUNTIME_ID: win-x64
      FFMPEG_VERSION: "8.1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set APP_VERSION
        run: |
          $content = Get-Content "${{ env.ASSEMBLY_INFO_PATH }}" -Raw
          $pattern = '<Version>([0-9]+(?:\.[0-9]+){1,3})</Version>'
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $version = $env:GITHUB_REF_NAME.TrimStart("v")
            $content = [regex]::Replace($content, $pattern, "<Version>$version</Version>")
            Set-Content -Path "${{ env.ASSEMBLY_INFO_PATH }}" -Value "$content" -NoNewline
          } else {
            $version = [regex]::Match($content, $pattern).Groups[1].Value
          }
          echo "APP_VERSION=$version" >> $env:GITHUB_ENV
          echo "Building version $version"

      - name: Restore
        run: dotnet restore --runtime "${{ env.RUNTIME_ID }}" "${{ env.SOLUTION_FILE_PATH }}"

      - name: Build
        run: dotnet build --no-restore --configuration Release -p:Platform=x64 --self-contained true /m:1 "${{ env.SOLUTION_FILE_PATH }}"

      # ffmpeg is bundled at build time so the app itself never downloads anything.
      - name: Fetch ffmpeg for bundling
        run: |
          New-Item -ItemType Directory -Force -Path Tools | Out-Null
          $zip = "ffmpeg-${{ env.FFMPEG_VERSION }}-win-x64.zip"
          $url = "https://github.com/ShareX/FFmpeg/releases/download/v${{ env.FFMPEG_VERSION }}/$zip"
          Invoke-WebRequest -Uri $url -OutFile "Tools\$zip"
          Expand-Archive -Path "Tools\$zip" -DestinationPath "Tools\ffmpeg-tmp" -Force
          $exe = Get-ChildItem -Path "Tools\ffmpeg-tmp" -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $exe.FullName "Tools\ffmpeg.exe"
          Remove-Item "Tools\ffmpeg-tmp" -Recurse -Force
          Remove-Item "Tools\$zip" -Force

      - name: Create setup + portable
        run: |
          & "ShareX.Setup\bin\Release\win-x64\ShareX.Setup.exe" -silent -job Release -platform x64

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CrySnap-x64
          path: |
            Output/CrySnap-${{ env.APP_VERSION }}-setup-x64.exe
            Output/CrySnap-${{ env.APP_VERSION }}-portable-x64.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: CrySnap ${{ env.APP_VERSION }}
          draft: false
          prerelease: false
          files: |
            Output/CrySnap-${{ env.APP_VERSION }}-setup-x64.exe
            Output/CrySnap-${{ env.APP_VERSION }}-portable-x64.zip
